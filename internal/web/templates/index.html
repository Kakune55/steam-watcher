<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Watcher</title>
  <link rel="stylesheet" href="/static/common.css">
  <style>
    :root {
      --cell-off: #223141;
      --cell-line: #314456;
      --heatmap-cell-size: 14px;
      --heatmap-gap: 4px;
    }

    .collect-meta {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .content {
      grid-template-columns: minmax(340px, 420px) minmax(0, 1fr);
      position: relative;
    }

    .friend-list {
      display: grid;
    }

    .friend-group {
      border-top: 1px solid var(--line);
    }

    .friend-group:first-child {
      border-top: 0;
    }

    .group-head {
      padding: 11px 16px;
      background: #1a2432;
      color: #c7d5e0;
      font-size: 13px;
      font-weight: 700;
    }

    .group-count {
      color: var(--muted);
      font-weight: 400;
    }

    .friend-row {
      width: 100%;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      padding: 12px 16px;
      border: 0;
      border-top: 1px solid rgba(47, 67, 89, 0.58);
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .friend-row:first-child {
      border-top: 0;
    }

    .friend-row.is-selected {
      background: rgba(40, 68, 95, 0.34);
    }

    .group-playing .friend-row {
      border-top-color: rgba(139, 197, 63, 0.18);
    }

    .group-online .friend-row {
      border-top-color: rgba(102, 192, 244, 0.18);
    }

    .group-offline .friend-row {
      border-top-color: rgba(154, 167, 179, 0.12);
    }

    .avatar,
    .avatar-fallback {
      width: 44px;
      height: 44px;
      display: block;
      border: 1px solid var(--line);
      background: #0f1721;
      object-fit: cover;
    }

    .avatar-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 16px;
      font-weight: 700;
    }

    .avatar.is-playing,
    .avatar-fallback.is-playing {
      border-color: var(--green);
    }

    .avatar.is-online,
    .avatar-fallback.is-online {
      border-color: var(--blue);
    }

    .friend-main {
      min-width: 0;
    }

    .friend-name {
      display: inline-block;
      max-width: 100%;
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .friend-status {
      margin-top: 4px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .is-online {
      color: var(--blue);
    }

    .is-playing {
      color: var(--green);
    }

    .is-offline {
      color: var(--off);
    }

    .history-panel {
      min-height: 760px;
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 32px);
      overflow: auto;
    }

    .history-empty {
      padding: 56px 28px;
      color: var(--muted);
      text-align: center;
    }

    .history-shell {
      display: grid;
      grid-template-rows: auto auto 1fr;
      min-height: 100%;
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: #141d29;
    }

    .history-friend {
      display: flex;
      gap: 12px;
      align-items: center;
      min-width: 0;
    }

    .history-avatar,
    .history-avatar-fallback {
      width: 54px;
      height: 54px;
      border: 1px solid var(--line);
      background: #0f1721;
      object-fit: cover;
      flex: 0 0 auto;
    }

    .history-avatar-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 20px;
      font-weight: 700;
    }

    .history-name {
      font-size: 22px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .history-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--line);
      background: var(--panel-strong);
    }

    .view-button {
      border: 0;
      border-left: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      cursor: pointer;
    }

    .view-button:first-child {
      border-left: 0;
    }

    .view-button.is-active {
      background: #27405a;
      color: var(--text);
    }

    .history-meta {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .history-meta strong {
      color: var(--text);
      font-weight: 600;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border: 1px solid var(--cell-line);
      background: var(--cell-off);
    }

    .history-body {
      padding: 16px;
      overflow-x: auto;
    }

    .history-note {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 12px;
    }

    .calendar-heatmap {
      display: grid;
      gap: 8px;
    }

    .year-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .month-card {
      border: 1px solid var(--line);
      background: var(--panel-strong);
      padding: 14px;
    }

    .month-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .month-bar {
      margin-top: 10px;
      height: 8px;
      display: grid;
      grid-template-columns: var(--playing-ratio, 0fr) var(--online-ratio, 0fr) var(--offline-ratio, 1fr);
      border: 1px solid var(--line);
      background: var(--cell-off);
      overflow: hidden;
    }

    .month-bar-playing {
      background: rgba(139, 197, 63, 0.55);
    }

    .month-bar-online {
      background: rgba(102, 192, 244, 0.5);
    }

    .month-bar-offline {
      background: rgba(154, 167, 179, 0.2);
    }

    .month-metrics {
      margin-top: 10px;
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .month-metrics strong {
      color: var(--text);
      font-weight: 600;
    }

    .calendar-months {
      display: grid;
      gap: 4px;
      align-items: end;
      margin-left: 34px;
      min-height: 18px;
      color: var(--muted);
      font-size: 11px;
    }

    .calendar-layout {
      display: grid;
      grid-template-columns: 28px auto;
      gap: 6px;
      align-items: start;
    }

    .weekday-labels {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .weekday-label,
    .calendar-cell {
      height: var(--heatmap-cell-size);
    }

    .calendar-grid {
      display: grid;
      gap: var(--heatmap-gap);
      grid-auto-flow: column;
    }

    .week-heatmap {
      display: grid;
      gap: 8px;
    }

    .hour-labels {
      display: grid;
      gap: var(--heatmap-gap);
      margin-left: 60px;
      color: var(--muted);
      font-size: 11px;
    }

    .week-row {
      display: grid;
      grid-template-columns: 54px auto;
      gap: 6px;
      align-items: center;
    }

    .week-day-label {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .week-day-grid {
      display: grid;
      gap: var(--heatmap-gap);
    }

    .calendar-cell {
      width: var(--heatmap-cell-size);
      border: 1px solid var(--cell-line);
      background: var(--cell-off);
      cursor: pointer;
    }

    .calendar-cell.is-online {
      background: rgba(102, 192, 244);
    }

    .calendar-cell.is-playing {
      background: rgb(139, 197, 63);
    }

    .calendar-cell.is-offline {
      background: rgba(154, 167, 179);
    }

    .calendar-cell.is-empty {
      opacity: 0.35;
    }

    .calendar-cell.is-selected {
      outline: 1px solid #d6e0ea;
      outline-offset: 1px;
    }

    .day-drilldown {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .day-drilldown-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
    }

    .day-drilldown-title {
      font-size: 14px;
      font-weight: 700;
    }

    .day-drilldown-note {
      color: var(--muted);
      font-size: 12px;
    }

    .day-summary-bar {
      margin-bottom: 14px;
      height: 10px;
      display: flex;
      width: 100%;
      border: 1px solid var(--line);
      background: var(--cell-off);
      overflow: hidden;
    }

    .day-summary-segment {
      min-width: 2px;
    }

    .day-summary-playing {
      background: rgba(139, 197, 63, 0.72);
    }

    .day-summary-online {
      background: rgba(102, 192, 244, 0.7);
    }

    .day-summary-offline {
      background: rgba(154, 167, 179, 0.42);
    }

    .day-timeline {
      position: relative;
      display: grid;
      gap: 12px;
      padding-left: 18px;
    }

    .day-timeline::before {
      content: "";
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: 1px;
      background: var(--line);
    }

    .timeline-item {
      position: relative;
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      left: -18px;
      top: 8px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--off);
      border: 1px solid var(--bg-alt);
    }

    .timeline-item.is-online::before {
      background: var(--blue);
    }

    .timeline-item.is-playing::before {
      background: var(--green);
    }

    .timeline-time {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      padding-top: 2px;
    }

    .timeline-card {
      border: 1px solid var(--line);
      background: var(--panel-strong);
      padding: 10px 12px;
    }

    .timeline-card.is-online {
      border-left: 3px solid var(--blue);
    }

    .timeline-card.is-playing {
      border-left: 3px solid var(--green);
    }

    .timeline-card.is-offline {
      border-left: 3px solid var(--off);
    }

    .timeline-title {
      font-size: 14px;
      font-weight: 700;
    }

    .timeline-title.is-online {
      color: var(--blue);
    }

    .timeline-title.is-playing {
      color: var(--green);
    }

    .timeline-title.is-offline {
      color: var(--off);
    }

    .timeline-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    details.runs {
      margin-top: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    details.runs summary {
      list-style: none;
      cursor: pointer;
      padding: 12px 16px;
      color: var(--muted);
      font-size: 13px;
      user-select: none;
    }

    details.runs summary::-webkit-details-marker {
      display: none;
    }

    .runs-list {
      border-top: 1px solid var(--line);
    }

    .run-row {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      gap: 14px;
      padding: 12px 16px;
      border-top: 1px solid rgba(47, 67, 89, 0.58);
    }

    .run-row:first-child {
      border-top: 0;
    }

    .run-status.is-success {
      color: var(--blue);
      font-weight: 600;
    }

    .run-status.is-failed {
      color: var(--danger);
      font-weight: 600;
    }

    .run-error {
      margin-top: 4px;
      color: var(--danger);
      font-size: 12px;
      word-break: break-word;
    }

    .empty {
      padding: 28px 16px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 1080px) {
      .content {
        grid-template-columns: 1fr;
      }

      .history-panel {
        min-height: 0;
        position: static;
        max-height: none;
        overflow: visible;
      }
    }

    @media (max-width: 760px) {
      :root {
        --heatmap-cell-size: 12px;
      }

      .topbar,
      .section-head,
      .history-top {
        flex-direction: column;
        align-items: flex-start;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .year-summary {
        grid-template-columns: 1fr;
      }

      .run-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">Steam Watcher</div>
        <h1>好友状态总览</h1>
      </div>
      <div class="topbar-actions">
        <div id="collectResult" class="collect-meta">采集间隔：{{ .Config.CollectInterval }}</div>
        <a href="/settings" class="nav-link">设置</a>
        <button id="collectButton" class="collect-button" type="button">立即采集</button>
      </div>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">好友总数</div>
        <div id="statTotal" class="stat-value">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">在线</div>
        <div id="statOnline" class="stat-value">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">游戏中</div>
        <div id="statPlaying" class="stat-value">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">上次同步</div>
        <div id="statCaptured" class="stat-value">-</div>
      </div>
    </section>

    <main class="content">
      <section class="section">
        <div class="section-head">
          <div class="section-title">好友</div>
        </div>
        <div id="friendList" class="friend-list">
          <div class="empty">正在加载好友列表...</div>
        </div>
      </section>

      <section id="historyPanel" class="section history-panel">
      </section>
    </main>

    <details class="runs">
      <summary>查看最近采集记录</summary>
      <div id="runList" class="runs-list">
        <div class="empty">正在加载采集记录...</div>
      </div>
    </details>
  </div>

  <script src="/static/index.js" defer></script>
</body>
</html>
